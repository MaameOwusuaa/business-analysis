<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Analyst · Business Insights</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body data-page="ai">
    <div id="app-view" class="app-view">
      <aside id="sidebar" class="sidebar"></aside>
      <main class="main-content">
        <header class="topbar">
          <div>
            <p>AI workspace analyst</p>
            <h2>AI analyst</h2>
          </div>
          <div class="user-chip">
            <div id="user-avatar">U</div>
            <div>
              <strong id="user-name">User</strong>
              <span id="user-role">Owner</span>
            </div>
          </div>
        </header>
        <section class="page active">
          <article class="panel">
            <div class="panel-header">
              <div>
                <p>Verified workspace insights</p>
                <h3>Ask the analyst</h3>
              </div>
            </div>
            <div class="ask-box">
              <textarea id="ai-question" rows="3" placeholder="What changed, what is driving it, and what should we do?"></textarea>
              <button id="ask-button" class="primary-button compact">Ask</button>
            </div>
            <div id="ai-output" class="ai-output">
              <p class="empty-state">Ask a question about your workspace results.</p>
            </div>
          </article>
        </section>
      </main>
    </div>
    <script src="/static/page-app.js"></script>
  </body>
</html>
